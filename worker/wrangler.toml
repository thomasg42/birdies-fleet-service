# Birdies booking backend. Deploy from this folder: npx wrangler deploy
# Never put secrets in this file. Set them with: npx wrangler secret put <NAME>
#   ADMIN_KEY       admin routes (fleet accounts, blocks, outbox review)
#   NOTIFY_WEBHOOK  n8n webhook that sends texts and emails (leave unset = dry run, nothing sent)
#   NOTIFY_SECRET   shared secret the webhook checks
name = "birdies-booking"
main = "src/index.mjs"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "birdies-booking"
database_id = "b7d8cb0d-a00c-4011-9868-02246f0062c3"

[triggers]
crons = ["*/5 * * * *"]

[vars]
SITE_URL = "https://thomasg42.github.io/birdies-fleet-service"
ALLOWED_ORIGINS = "https://thomasg42.github.io"
ALLOW_LOCALHOST = "1"
OWNER_NAME = "Jay"
# Where Jay's alerts go (Jay, 2026-10-24 text).
OWNER_PHONE = "4355314127"
OWNER_EMAIL = "birdiesfleet@gmail.com"
